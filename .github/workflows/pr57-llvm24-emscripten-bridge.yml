name: PR57 source patch bridge

on:
  pull_request:
    branches:
      - main
    paths:
      - ".bridge/pr57-run.txt"

jobs:
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact Gitea patch chain
        uses: actions/upload-artifact@v4
        with:
          name: project-nonlinear-c5211203-patches
          path: .bridge/patches
          retention-days: 1
