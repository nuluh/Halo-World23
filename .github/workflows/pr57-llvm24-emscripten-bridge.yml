name: PR57 hosted LLVM24 and Emscripten validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "mirror/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ORIGIN_PR_HEAD: c5211203c3fc8c3e806d907baec63b62fa277669
      MIRROR_TREE: 35a5016ae19c452a5afdd45ba4c63b686dff82ba
      EIGEN_TREE: 3a87d0dab1c11e5ca0a260a372ad9e2a07759e5d
      SDK_SHA256: 6e7c6d26cf8bde31e6cf6a377c113f913cb2d30f4c2d671c1042e1c4bcd16495
      SDK_URL: https://storage.googleapis.com/webassembly/emscripten-releases-builds/linux/6afbd83493d647051772d491124187d4e9a0cda9/wasm-binaries.tar.xz
    steps:
      - name: Checkout exact hosted mirror head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify mirrored c521 source subset
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD:mirror)"
          echo "ORIGIN_PR_HEAD=$ORIGIN_PR_HEAD"
          echo "MIRROR_TREE=$actual"
          test "$actual" = "$MIRROR_TREE"

      - name: Restore and verify vendored Eigen 3.4.0
        run: |
          set -euo pipefail
          rm -rf /tmp/eigen-src /tmp/eigen.tar.gz
          mkdir -p /tmp/eigen-src
          curl -L --fail --retry 3 --retry-all-errors \
            https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz \
            -o /tmp/eigen.tar.gz
          tar -xzf /tmp/eigen.tar.gz -C /tmp/eigen-src --strip-components=1
          cd /tmp/eigen-src
          git init -q
          git add -f Eigen
          root_tree="$(git write-tree)"
          eigen_tree="$(git ls-tree "$root_tree" Eigen | awk '{print $3}')"
          echo "EIGEN_TREE=$eigen_tree"
          test "$eigen_tree" = "$EIGEN_TREE"
          mkdir -p "$GITHUB_WORKSPACE/mirror/headers"
          cp -a Eigen "$GITHUB_WORKSPACE/mirror/headers/Eigen"

      - name: Fetch and verify Emscripten 7.0.0 SDK
        run: |
          set -euo pipefail
          rm -rf /tmp/emsdk700 /tmp/wasm-binaries.tar.xz
          mkdir -p /tmp/emsdk700
          curl -L --fail --retry 4 --retry-all-errors "$SDK_URL" -o /tmp/wasm-binaries.tar.xz
          echo "${SDK_SHA256}  /tmp/wasm-binaries.tar.xz" | sha256sum -c -
          tar -xJf /tmp/wasm-binaries.tar.xz -C /tmp/emsdk700
          test -x /tmp/emsdk700/install/bin/clang
          test -x /tmp/emsdk700/install/bin/clang++
          test -x /tmp/emsdk700/install/bin/wasm-ld
          test -f /tmp/emsdk700/install/emscripten/em++

      - name: Record toolchain versions
        run: |
          set -euo pipefail
          cmake --version
          ninja --version
          node --version
          /tmp/emsdk700/install/bin/clang --version
          /tmp/emsdk700/install/bin/clang++ --version
          /tmp/emsdk700/install/bin/wasm-ld --version
          PATH="/tmp/emsdk700/install/emscripten:/tmp/emsdk700/install/bin:$PATH" em++ --version

      - name: Configure native Clang 24 build
        working-directory: mirror
        run: |
          set -euo pipefail
          rm -rf build-clang24
          CC=/tmp/emsdk700/install/bin/clang \
          CXX=/tmp/emsdk700/install/bin/clang++ \
          cmake -S . -B build-clang24 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENVFIFE_ENABLE_HARDENING=ON \
            -DOPENVFIFE_ENABLE_SANITIZERS=OFF \
            -DOPENVFIFE_WARNINGS_AS_ERRORS=ON

      - name: Public header smoke with Clang 24
        working-directory: mirror
        run: |
          set -euo pipefail
          cmake --build build-clang24 --target openvfife_public_header_smoke --parallel 2

      - name: Full native Clang 24 build
        working-directory: mirror
        run: |
          set -euo pipefail
          cmake --build build-clang24 --parallel 2

      - name: Full native CTest with Clang 24
        working-directory: mirror
        run: |
          set -euo pipefail
          ctest --test-dir build-clang24 --output-on-failure

      - name: Fresh Emscripten WASM build and syntax smoke
        working-directory: mirror
        run: |
          set -euo pipefail
          export PATH="/tmp/emsdk700/install/emscripten:/tmp/emsdk700/install/bin:$PATH"
          rm -f web/src/solver/vfife.js
          em++ --version
          bash scripts/build_wasm.sh
          test -s web/src/solver/vfife.js
          node --check web/src/solver/vfife.js
          echo "VFIFE_JS_BYTES=$(wc -c < web/src/solver/vfife.js)"
          echo "WASM_VALIDATION=PASS"
