name: Cleanup PR57 temporary branch refs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary PR57 refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for ref in             "heads/tmp%2Fpr57-llvm24-bridge"             "heads/tmp%2Fpr57-source-mirror"
          do
            code="$(curl -sS -o /tmp/delete-ref.json -w '%{http_code}'               -X DELETE               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/git/refs/$ref")"
            if [ "$code" != "204" ] && [ "$code" != "404" ]; then
              cat /tmp/delete-ref.json
              echo "unexpected HTTP $code deleting $ref" >&2
              exit 1
            fi
            echo "$ref -> HTTP $code"
          done
