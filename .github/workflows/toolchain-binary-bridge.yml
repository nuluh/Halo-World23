name: toolchain-binary-bridge

on:
  push:
    paths:
      - ".github/workflows/toolchain-binary-bridge.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify LLVM 23.1.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchains/chunks
          curl -fL --retry 5 --retry-delay 2 \
            -o toolchains/LLVM-23.1.5-Linux-X64.tar.zst \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-Linux-X64.tar.zst"
          echo "c3107384835f788768f614db610e87fba7077f125ca950eb02a78bab0a308065  toolchains/LLVM-23.1.5-Linux-X64.tar.zst" | sha256sum -c -
          split -b 400M -d -a 2 toolchains/LLVM-23.1.5-Linux-X64.tar.zst toolchains/chunks/llvm.part-
          ls -lh toolchains/chunks
          test "$(ls toolchains/chunks/llvm.part-* | wc -l)" -eq 3

      - name: Upload LLVM chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: llvm-23.1.5-linux-x64-part-00
          path: toolchains/chunks/llvm.part-00
          compression-level: 0
          retention-days: 1

      - name: Upload LLVM chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: llvm-23.1.5-linux-x64-part-01
          path: toolchains/chunks/llvm.part-01
          compression-level: 0
          retention-days: 1

      - name: Upload LLVM chunk 02
        uses: actions/upload-artifact@v4
        with:
          name: llvm-23.1.5-linux-x64-part-02
          path: toolchains/chunks/llvm.part-02
          compression-level: 0
          retention-days: 1
