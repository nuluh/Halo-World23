name: toolchain-binary-bridge

on:
  push:
    paths:
      - ".github/workflows/toolchain-binary-bridge.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Create tiny placeholder payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          printf 'placeholder\n' > out/a
          cp out/a out/b
          cp out/a out/c
          cp out/a out/d

      - uses: actions/upload-artifact@v4
        with:
          name: placeholder-a
          path: out/a
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: placeholder-b
          path: out/b
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: placeholder-c
          path: out/c
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: placeholder-d
          path: out/d
          compression-level: 0
          retention-days: 1
