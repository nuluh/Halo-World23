name: PR57 GCC 14.2.0 regression after Clang fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - ".validation/pr57-gcc-trigger.txt"

jobs:
  gcc142-regression:
    runs-on: ubuntu-latest
    container:
      image: gcc:14.2.0
    defaults:
      run:
        shell: bash
    env:
      ORIGIN_PR_HEAD: 8798f6b4cbaca6dc09ed244b0962c6a159c9c484
      MIRROR_TREE: 4a56a0c64efe5f314b0566c450a987ed7d8d1f1b
      EIGEN_TREE: 3a87d0dab1c11e5ca0a260a372ad9e2a07759e5d
    steps:
      - name: Install validation support tools
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git cmake ninja-build python3

      - name: Checkout exact hosted mirror head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify mirrored final PR57 source subset
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD:mirror)"
          echo "ORIGIN_PR_HEAD=$ORIGIN_PR_HEAD"
          echo "MIRROR_TREE=$actual"
          test "$actual" = "$MIRROR_TREE"

      - name: Restore and verify vendored Eigen 3.4.0
        run: |
          set -euo pipefail
          rm -rf /tmp/eigen-src /tmp/eigen.tar.gz
          mkdir -p /tmp/eigen-src
          curl -L --fail --retry 3 --retry-all-errors \
            https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz \
            -o /tmp/eigen.tar.gz
          tar -xzf /tmp/eigen.tar.gz -C /tmp/eigen-src --strip-components=1
          cd /tmp/eigen-src
          git init -q
          git add -f Eigen
          root_tree="$(git write-tree)"
          eigen_tree="$(git ls-tree "$root_tree" Eigen | awk '{print $3}')"
          echo "EIGEN_TREE=$eigen_tree"
          test "$eigen_tree" = "$EIGEN_TREE"
          mkdir -p "$GITHUB_WORKSPACE/mirror/headers"
          cp -a Eigen "$GITHUB_WORKSPACE/mirror/headers/Eigen"

      - name: Record exact GCC 14.2.0 toolchain versions
        run: |
          set -euo pipefail
          gcc --version
          g++ --version
          cmake --version
          ninja --version
          python3 --version

      - name: Configure GCC 14.2.0 native regression build
        working-directory: mirror
        run: |
          set -euo pipefail
          rm -rf build-gcc142
          CC=gcc CXX=g++ \
          cmake -S . -B build-gcc142 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENVFIFE_ENABLE_HARDENING=ON \
            -DOPENVFIFE_ENABLE_SANITIZERS=OFF \
            -DOPENVFIFE_WARNINGS_AS_ERRORS=ON

      - name: Public header smoke with GCC 14.2.0
        working-directory: mirror
        run: |
          set -euo pipefail
          cmake --build build-gcc142 --target openvfife_public_header_smoke --parallel 2

      - name: Full GCC 14.2.0 native build
        working-directory: mirror
        run: |
          set -euo pipefail
          cmake --build build-gcc142 --parallel 2

      - name: Full GCC 14.2.0 CTest including frozen parity
        working-directory: mirror
        run: |
          set -euo pipefail
          ctest --test-dir build-gcc142 --output-on-failure
